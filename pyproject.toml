[project]
name = "owasp-rag-eval"
version = "0.1.0"
description = "RAG assistant over the OWASP Cheat Sheet Series, with answer-quality and prompt-injection evals"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "openai>=1.50",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
    "numpy>=1.26",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "httpx>=0.27"]
# Local classifiers (MiniCheck groundedness, Prompt Guard): `uv sync --group ml`. CPU builds,
# because the GPU is busy with the answer model during evals.
ml = ["torch>=2.5", "transformers>=4.46", "sentencepiece>=0.2"]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/owasp_rag"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
